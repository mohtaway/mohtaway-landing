document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin

      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;

      delete pendingRelays[uuid];

      const out = [];

      // root's never-relay rule) are what hold in fully opaque chains

      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

          return;
        }

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

ربتي معهم جميلة جدًا.. خدمتهم ممتازة وسريعة.. خدمات ما بعد البيع رائعة.. بالتأكيد سيكونون الخيار رقم ١ دائمًا.\"<\u002Fblockquote>\n            <figcaption style=\"color:rgba(234,246,246,.6);font-size:.8rem;font-weight:600\">عبدالمجيد خلف المطيري<\u002Ffigcaption>\n          <\u002Ffigure>\n          <figure style=\"margin:0;display:flex;flex-direction:column;gap:12px;padding:22px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.05)\">\n            <span style=\"color:#FFC940;letter-spacing:3px;font-size:.85rem\">★★★★★<\u002Fspan>\n            <blockquote style=\"margin:0;color:#EAF6F6;font-size:.92rem;line-height:1.8\">\"أطلق متجر تعاملت معه بكل صراحة، يكفيك المصداقية وحسن التعامل. إذا تبغى خدمة تبيّض الوجه لا تتعدى متجر محتواي.\"<\u002Fblockquote>\n            <figcaption style=\"color:rgba(234,246,246,.6);font-size:.8rem;font-weight:600\">ساره عبدالله<\u002Ffigcaption>\n          <\u002Ffigure>\n          <figure style=\"margin:0;display:flex;flex-direction:column;gap:12px;padding:22px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.05)\">\n            <span style=\"color:#FFC940;letter-spacing:3px;font-size:.85rem\">★★★★★<\u002Fspan>\n            <blockquote style=\"margin:0;color:#EAF6F6;font-size:.92rem;line-height:1.8\">\"ألف شكر على التعامل الراقي والسرعة في التنفيذ.\"<\u002Fblockquote>\n            <figcaption style=\"color:rgba(234,246,246,.6);font-size:.8rem;font-weight:600\">عيسى الأحمد<\u002Ffigcaption>\n          <\u002Ffigure>\n          <figure style=\"margin:0;display:flex;flex-direction:column;gap:12px;padding:22px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.05)\">\n            <span style=\"color:#FFC940;letter-spacing:3px;font-size:.85rem\">★★★★★<\u002Fspan>\n            <blockquote style=\"margin:0;color:#EAF6F6;font-size:.92rem;line-height:1.8\">\"متجر مبدع ورائع، والمدح فيه حقًا يستاهل أكثر وأكثر.\"<\u002Fblockquote>\n            <figcaption style=\"color:rgba(234,246,246,.6);font-size:.8rem;font-weight:600\">مطلق الجميلي<\u002Ffigcaption>\n          <\u002Ffigure>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"process\" style=\"padding:clamp(56px,9vw,94px) 0\">\n      <div style=\"max-width:1160px;margin:0 auto;padding:0 20px\">\n        <div style=\"max-width:640px;margin-bottom:34px\">\n          <p style=\"display:inline-flex;align-items:center;gap:9px;margin:0 0 12px;color:#007076;font-size:.84rem;font-weight:700\"><span style=\"width:10px;height:10px;border-radius:3px;background:#007E85;transform:rotate(45deg);box-shadow:0 0 0 5px #EBF6F6\"><\u002Fspan>خطوات العمل<\u002Fp>\n          <h2 style=\"margin:0 0 12px;font-size:clamp(1.6rem,5vw,2.6rem);line-height:1.3;letter-spacing:-.02em\">من الملفات إلى التسليم، <span style=\"background:linear-gradient(transparent 64%, rgba(255,201,64,.85) 64%, rgba(255,201,64,.85) 92%, transparent 92%)\">خطوة بخطوة.<\u002Fspan><\u002Fh2>\n          <p style=\"margin:0;color:#4A6567\">المسار واضح، والمدة تبدأ بعد اكتمال المواد المطلوبة لكل باقة.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px\">\n          <article style=\"display:grid;grid-template-columns:52px 1fr;gap:16px;padding:22px;border:1px solid #DDF0F0;border-radius:16px;background:#FFFFFF\">\n            <span style=\"width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#FFC940;color:#6D5000;font-weight:700;transform:rotate(45deg);box-shadow:0 8px 18px rgba(255,201,64,.35)\"><span style=\"transform:rotate(-45deg)\">١<\u002Fspan><\u002Fspan>\n            <span><h3 style=\"margin:0 0 5px;font-size:1.05rem\">ترسل ملفات المشروع<\u002Fh3><p style=\"margin:0;color:#4A6567;font-size:.88rem\">الشعار والألوان والصور والمنتجات وأي مرجع مهم.<\u002Fp><\u002Fspan>\n          <\u002Farticle>\n          <article style=\"display:grid;grid-template-columns:52px 1fr;gap:16px;padding:22px;border:1px solid #DDF0F0;border-radius:16px;background:#FFFFFF\">\n            <span style=\"width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#FFC940;color:#6D5000;font-weight:700;transform:rotate(45deg);box-shadow:0 8px 18px rgba(255,201,64,.35)\"><span style=\"transform:rotate(-45deg)\">٢<\u002Fspan><\u002Fspan>\n            <span><h3 style=\"margin:0 0 5px;font-size:1.05rem\">نبني ونشارك المعاينة<\u002Fh3><p style=\"margin:0;color:#4A6567;font-size:.88rem\">نرتب الواجهة والمحتوى ثم نشاركك النسخة للمراجعة.<\u002Fp><\u002Fspan>\n          <\u002Farticle>\n          <article style=\"display:grid;grid-template-columns:52px 1fr;gap:16px;padding:22px;border:1px solid #DDF0F0;border-radius:16px;background:#FFFFFF\">\n            <span style=\"width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#FFC940;color:#6D5000;font-weight:700;transform:rotate(45deg);box-shadow:0 8px 18px rgba(255,201,64,.35)\"><span style=\"transform:rotate(-45deg)\">٣<\u002Fspan><\u002Fspan>\n            <span><h3 style=\"margin:0 0 5px;font-size:1.05rem\">نعالج الملاحظات ونسلّم<\u002Fh3><p style=\"margin:0;color:#4A6567;font-size:.88rem\">تُجمع الملاحظات حسب نطاق الباقة، ثم يُسلّم المتجر مرتبًا.<\u002Fp><\u002Fspan>\n          <\u002Farticle>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section aria-label=\"تشخيص مجاني\" style=\"position:relative;overflow:clip;background:linear-gradient(100deg,#FFC940 0%,#FFD76E 100%)\">\n      <div aria-hidden=\"true\" style=\"position:absolute;top:-40px;left:8%;width:120px;height:120px;border:2px solid rgba(109,80,0,.15);border-radius:26px;transform:rotate(45deg)\"><\u002Fdiv>\n      <div aria-hidden=\"true\" style=\"position:absolute;bottom:-50px;right:6%;width:140px;height:140px;background:rgba(109,80,0,.07);border-radius:30px;transform:rotate(45deg)\"><\u002Fdiv>\n      <div style=\"max-width:1160px;margin:0 auto;padding:clamp(34px,6vw,54px) 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px\">\n        <div style=\"max-width:620px\">\n          <p style=\"margin:0 0 8px;color:#6D5000;font-size:.84rem;font-weight:700\">ميزة ما تلقاها عند غيرنا<\u002Fp>\n          <h2 style=\"margin:0 0 8px;font-size:clamp(1.5rem,4.6vw,2.3rem);line-height:1.3;letter-spacing:-.02em;color:#0E3E41\">عندك متجر أو ناوي تبدأ؟<br>استشارتك الأولى <span style=\"display:inline-block;margin-top:10px;background:#0E3E41;color:#FFC940;padding:2px 12px;border-radius:10px;white-space:nowrap\">مجانًا<\u002Fspan><\u002Fh2>\n          <p style=\"margin:0;color:#6D5000;font-size:.98rem\">متجرك قائم؟ أرسل رابطه ونشخّصه لك. لسّه ما بدأت؟ كلمنا عن فكرتك ونرشدك للخطوة الصحيحة — بدون أي التزام.<\u002Fp>\n        <\u002Fdiv>\n        <a href=\"{{ waFree }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:10px;min-height:56px;padding:13px 26px;border-radius:14px;background:#0E3E41;color:#FFFFFF;font-weight:700;font-size:1.02rem;text-decoration:none;box-shadow:0 14px 30px rgba(14,62,65,.3)\" style-hover=\"background:#094A50\">احجز استشارتك المجانية ←<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"faq\" style=\"padding:clamp(56px,9vw,94px) 0;background:linear-gradient(180deg,#F8FCFC 0%,#EBF6F6 100%)\">\n      <div style=\"max-width:1160px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(28px,5vw,56px);align-items:start\">\n        <div>\n          <p style=\"display:inline-flex;align-items:center;gap:9px;margin:0 0 12px;color:#007076;font-size:.84rem;font-weight:700\"><span style=\"width:10px;height:10px;border-radius:3px;background:#007E85;transform:rotate(45deg);box-shadow:0 0 0 5px #FFFFFF\"><\u002Fspan>أسئلة قبل الطلب<\u002Fp>\n          <h2 style=\"margin:0 0 12px;font-size:clamp(1.6rem,5vw,2.6rem);line-height:1.3;letter-spacing:-.02em\">إجابات واضحة قبل ما <span style=\"background:linear-gradient(transparent 64%, rgba(255,201,64,.85) 64%, rgba(255,201,64,.85) 92%, transparent 92%)\">تدفع.<\u002Fspan><\u002Fh2>\n          <p style=\"margin:0 0 20px;color:#4A6567\">إذا بقي شيء خاص بمشروعك، تواصل معنا على واتساب قبل اختيار الباقة.<\u002Fp>\n          <a href=\"{{ waAsk }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:12px 22px;border-radius:14px;background:#1FAF55;color:#FFFFFF;font-weight:700;text-decoration:none\" style-hover=\"background:#189549\">اسأل على واتساب<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:10px\">\n          <details open=\"\" style=\"border:1px solid #DDF0F0;border-radius:14px;background:#FFFFFF\"><summary style=\"padding:17px 20px;font-weight:700;cursor:pointer;list-style:none\">هل تشمل الباقات اشتراك منصة سلة أو زد؟<\u002Fsummary><p style=\"margin:0;padding:0 20px 18px;color:#4A6567;font-size:.92rem\">لا. قيمة اشتراك المنصة والدومين والتطبيقات المدفوعة ليست ضمن سعر التصميم، إلا إذا ذُكر خلاف ذلك في صفحة الخدمة.<\u002Fp><\u002Fdetails>\n          <details style=\"border:1px solid #DDF0F0;border-radius:14px;background:#FFFFFF\"><summary style=\"padding:17px 20px;font-weight:700;cursor:pointer;list-style:none\">متى تبدأ مدة التنفيذ؟<\u002Fsummary><p style=\"margin:0;padding:0 20px 18px;color:#4A6567;font-size:.92rem\">تبدأ بعد استلام الملفات والمعلومات المطلوبة كاملة، لأن نقص الصور أو بيانات المنتجات يوقف البناء والمراجعة.<\u002Fp><\u002Fdetails>\n          <details style=\"border:1px solid #DDF0F0;border-radius:14px;background:#FFFFFF\"><summary style=\"padding:17px 20px;font-weight:700;cursor:pointer;list-style:none\">هل تضمنون مبيعات بعد الإطلاق؟<\u002Fsummary><p style=\"margin:0;padding:0 20px 18px;color:#4A6567;font-size:.92rem\">لا نضمن رقم مبيعات. دور الصفحة والمتجر تحسين الوضوح وتجربة العميل، أما النتائج فتتأثر بالمنتج والسعر والزيارات والعرض والتشغيل.<\u002Fp><\u002Fdetai
